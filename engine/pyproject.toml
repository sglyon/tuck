[project]
name = "tuck-engine"
version = "0.1.0"
description = "Local capture, Parakeet transcription and meeting intelligence for Tuck"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.1,<3", "soxr>=0.5,<1", "sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "sounddevice>=0.5,<1", "soundcard>=0.4,<1; sys_platform != 'darwin'", "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3", "keyring>=25,<26"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
