name: Check
on: [push, pull_request]
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev libdbus-1-dev
      - name: Prepare empty resource directory for compile-only checks
        run: node -e "require('node:fs').mkdirSync('src-tauri/binaries/native', {recursive:true})"
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path crates/tuck-core/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: cargo check --manifest-path src-tauri/Cargo.toml --bins --locked
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --project engine --python 3.12 --locked
      - run: uv run --project engine python -m unittest discover -s engine/tests -v
      - if: runner.os == 'macOS'
        run: swiftc -O -parse-as-library native/macos/AudioCapture.swift -o /tmp/tuck-audio -framework ScreenCaptureKit -framework AVFoundation
